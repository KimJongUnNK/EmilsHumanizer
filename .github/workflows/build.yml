name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pyinstaller
      - run: pytest -q test_humanizer.py
      - name: Version in die App schreiben
        shell: python
        run: |
          import os, pathlib
          path = pathlib.Path("humanizer.py")
          source = path.read_text(encoding="utf-8")
          assert 'BUILD = "dev"' in source
          path.write_text(source.replace('BUILD = "dev"', f'BUILD = "{os.environ["GITHUB_SHA"]}"'), encoding="utf-8")
      - run: pyinstaller --onefile --windowed --name Humanizer --add-data "beispieltexte;beispieltexte" humanizer.py
      # Startet die fertige .exe einmal: läuft sie, trägt sie die richtige Version und stecken die Texte drin?
      - name: Selbsttest der exe
        shell: pwsh
        run: |
          Start-Process -FilePath dist\Humanizer.exe -ArgumentList '--selftest', "$PWD\selftest.json" -Wait
          $r = Get-Content selftest.json | ConvertFrom-Json
          $r | Format-List
          if ($r.build -ne $env:GITHUB_SHA -or $r.sachlich -lt 20 -or $r.bericht -lt 20 -or $r.locker -lt 20) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Humanizer
          path: dist/Humanizer.exe
      # Jeder Stand auf main ersetzt die Download-Version.
      - if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Humanizer.exe --target "$GITHUB_SHA" \
            --title "Emils Humanizer" \
            --notes "Aktuelle Version. Humanizer.exe herunterladen und starten. Voraussetzung: Ollama (https://ollama.com/download)."
